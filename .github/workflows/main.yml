name: Check Grades Auto

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TZ: Asia/Shanghai
          GRADE_USERNAME: ${{ secrets.GRADE_USERNAME }}
          GRADE_PASSWORD: ${{ secrets.GRADE_PASSWORD }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
          TARGET_XNM: ${{ secrets.TARGET_XNM }}
        run: python main.py

      - name: Commit and push cache if changed
        run: |
          git config user.name "GradeBot"
          git config user.email "actions@github.com"

          if [ -f grade_cache.txt ]; then
            git add grade_cache.txt
          fi

          if git diff --cached --quiet; then
            echo "No cache changes."
            exit 0
          fi

          git commit -m "Update grade cache"
          git push
