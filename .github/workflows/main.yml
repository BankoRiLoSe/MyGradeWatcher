name: Check Grades Auto

on:
  schedule:
    - cron: '*/30 * * * *'  # 每30分钟运行一次 (北京时间可能会有延迟，正常现象)
  workflow_dispatch:      # 允许你手动点按钮运行测试

# 给仓库写入权限，这样才能保存 grade_cache.txt
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        # 设置时区为北京时间，方便日志查看
        env:
          TZ: Asia/Shanghai
        run: python main.py

      - name: Commit and push cache if changed
        run: |
          # 配置 git 机器人身份
          git config --global user.name "GradeBot"
          git config --global user.email "actions@github.com"
          
          # 检查是否有 grade_cache.txt 且内容发生了变化
          git add grade_cache.txt
          
          # 如果文件有变化，就提交保存；没变化就不动
          # timestamp 用于确保每次提交信息不同
          git commit -m "Update grade cache" || exit 0
          git push
